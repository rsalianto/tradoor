# Security headers for every answer nginx gives tradoor. Included at the server
# level and again in each location that adds a header of its own, as nginx drops
# the server's add_header lines in a location that has any.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# The same policy the page carries (web/site.ts), plus what only a header can say.
# Cloudflare's analytics host is there for Cloudflare Web Analytics, whose tag
# Cloudflare adds to each page itself when it is turned on for the site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
