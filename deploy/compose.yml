# tradoor on a server: PostgreSQL, tradoor-server and tradoor-recorder, all from
# the one image the Dockerfile builds. Keep this file in /var/www/tradoor with a
# .env beside it (see env.example). nginx on the host serves ./web and proxies
# /api and /data to the server.
name: tradoor

x-app: &app
  image: ${TRADOOR_IMAGE:-tradoor:latest}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Settings named here reach the program; the rest of .env only fills in this
    # file. Empty is the same as unset: no bot, and Settings says so.
    TRADOOR_TELEGRAM_TOKEN: ${TRADOOR_TELEGRAM_TOKEN:-}
    TRADOOR_SITE_URL: ${TRADOOR_SITE_URL:-}
    # Footprint history read from Binance's archive, market@first-day: about half
    # a gigabyte downloaded a month of it, a file at a time, and some 2 MB a month
    # kept. Set it empty in .env to read none.
    TRADOOR_FOOTPRINT_HISTORY: ${TRADOOR_FOOTPRINT_HISTORY-binance-perp:BTCUSDT@2026-01-01}
  volumes:
    - data:/data

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    <<: *app
    command: ["tradoor-server"]
    # Bound to loopback: only nginx on this host reaches it.
    ports:
      - "127.0.0.1:${TRADOOR_PORT:-8080}:8080"

  recorder:
    <<: *app
    command: ["tradoor-recorder"]

  # Copies the web app out of the image into ./web, where nginx serves it, and
  # exits. Assets from the last week stay, so a tab opened before a deploy can
  # still load the files it names; a file at the top that the build no longer
  # makes (ga.js) goes.
  web:
    image: ${TRADOOR_IMAGE:-tradoor:latest}
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "mkdir -p /out/assets && find /out/assets -type f -mtime +7 -delete && cp -r /app/web/. /out/ && for f in /out/*; do [ -f \"$$f\" ] && [ ! -e \"/app/web/$${f##*/}\" ] && rm -f \"$$f\"; done; true"]
    volumes:
      - ./web:/out

volumes:
  pgdata:
  data:
